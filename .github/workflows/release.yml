name: Release

# Push a tag like v0.2.0 (matching the version in package.json / tauri.conf.json) to build the Windows and Linux
# installers, publish them as a GitHub release, and update the in-app updater feed (latest.json).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    env:
      # Exposed at job level so the optional signing step's `if` can see whether it's set.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Optional Windows code signing: add WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD secrets
      # to sign the installer and app (removes the "unknown publisher" SmartScreen prompt). Skipped when absent.
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $conf.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
          $conf.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

      # Release notes: .github/release-notes/<tag>.md (written with each version), then how to install. They become the
      # GitHub release text and the notes the in-app updater shows.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo 'body<<NOTES_EOF'
            if [ -f "$f" ]; then cat "$f"; echo; echo; fi
            echo 'Windows users run the `-setup.exe`; Linux users take the `.AppImage` (self-updating), `.deb` or `.rpm`.'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update packages so the in-app updater accepts them (not the same as Windows code signing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DS1 Studio ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # The AppImage must not carry the build machine's Wayland/xkb/xcb libraries: on current Mesa they break EGL
      # ("Could not create default EGL display: EGL_BAD_PARAMETER", a blank window). Tauri CLI 2.12+ leaves them out;
      # this fails the run if one ever comes back.
      - name: Check the AppImage's bundled libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          img=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$img" --appimage-extract > /dev/null
          bad=$(find squashfs-root -name 'libwayland-*.so*' -o -name 'libxkbcommon*.so*' -o -name 'libxcb*.so*' -o -name 'libEGL*.so*' -o -name 'libGL*.so*' -o -name 'libgbm*.so*' -o -name 'libdrm*.so*')
          if [ -n "$bad" ]; then echo "::error::The AppImage bundles host graphics libraries:"; echo "$bad"; exit 1; fi
          grep -rl 'GDK_BACKEND=x11' squashfs-root/apprun-hooks 2>/dev/null && { echo "::error::The AppImage forces GDK_BACKEND=x11"; exit 1; } || true
          echo "AppImage OK: no bundled Wayland/xkb/xcb/EGL/GL libraries"
