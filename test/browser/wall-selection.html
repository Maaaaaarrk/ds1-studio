<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wall selection smoke test</title></head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script>
<script type="module">
// Dev-server-only smoke harness. Exercise the real canvas wheel handler and React effects.
// Open an isolated overlapping-wall map, click the wall, then F8=forward, F9=reverse, F10=three events in one batch.
let point = null;
window.addEventListener('pointerdown', event => {
  if (event.target.matches?.('.viewport-overlay')) point = [event.clientX, event.clientY];
});
window.addEventListener('keydown', event => {
  if (!point || !['F8','F9','F10'].includes(event.code)) return;
  event.preventDefault();
  const canvas = document.querySelector('.viewport-overlay');
  for (let n = 0; n < (event.code === 'F10' ? 3 : 1); n++) canvas?.dispatchEvent(new WheelEvent('wheel', {
    clientX: point[0], clientY: point[1], deltaY: event.code === 'F9' ? -120 : 120,
    shiftKey: true, bubbles: true, cancelable: true,
  }));
});
</script></body></html>
